<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#4F46E5">
    <meta name="description" content="IEC60034 Temperature and Resistance Calculator">
    <base href="/iec60034-calculator/">
    <title>IEC60034 Calculator</title>
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="./manifest.json">
    
    <!-- Icons -->
    <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png">
    <link rel="apple-touch-icon" href="./icon-192.png">
    <link rel="apple-touch-icon" sizes="512x512" href="./icon-512.png">
    
    <script crossorigin src="./assets/react.production.min.js"></script>
    <script crossorigin src="./assets/react-dom.production.min.js"></script>
    <script src="./assets/babel.min.js"></script>
    <script src="./assets/tailwind.css"></script>
    
    <style>
            .formula-title {
                font-weight: bold;
                font-size: 0.75rem;
                margin-bottom: 10px;
                color: #111827;
                text-align: left;
            }
            
            .formula-legend {
                margin-top: 10px;
                font-size: 0.75rem;
                color: #4b5563;
                line-height: 1.5;
                width: 100%;
                border-top: 1px dashed #d1d5db;
                padding-top: 10px;
            }
            
            .legend-item {
                display: block;
                margin-bottom: 2px;
            }
            
            .legend-item strong {
                color: #1f2937;
            }    
                    
            .formula-card-content {
                display: flex;
                flex-direction: column;
                align-items: left;
                justify-content: left;
                padding: 15px;
                background: #f9fafb;
                border-radius: 8px;
                margin: 10px 0;
            }
            
            .formula-display {
                font-family: "Times New Roman", Times, serif;
                font-style: italic;
                font-size: 0.9rem;
                display: flex;
                align-items: center;
                gap: 6px;
                color: #1f2937;
                flex-wrap: wrap;
            }
            
            .fraction-container {
                display: inline-flex;
                flex-direction: column;
                align-items: center;
                vertical-align: middle;
            }
            
            .fraction-numerator {
                padding: 0 5px 1px 5px;
            }
            
            .fraction-denominator {
                border-top: 1.5px solid #374151;
                padding: 1px 5px 0 5px;
                width: 100%;
                text-align: center;
            }
            
            .sub {
                font-style: normal;
                font-size: 0.7em;
                vertical-align: sub;
                line-height: 0;
            }

            .section-divider {
                display: flex;
                align-items: center;
                margin: 16px 0;
                gap: 8px;
            }

            .section-divider-line {
                flex: 1;
                height: 1px;
                background: #e5e7eb;
            }

            .section-divider-label {
                font-size: 0.65rem;
                font-weight: 700;
                letter-spacing: 0.08em;
                color: #9ca3af;
                text-transform: uppercase;
                white-space: nowrap;
            }

            .method-header {
                display: flex;
                align-items: center;
                gap: 8px;
                margin-bottom: 10px;
            }

            .method-badge {
                font-size: 0.65rem;
                font-weight: 700;
                letter-spacing: 0.05em;
                padding: 2px 8px;
                border-radius: 9999px;
                text-transform: uppercase;
            }

            .method-badge-1 {
                background: #ede9fe;
                color: #6d28d9;
            }

            .method-badge-2 {
                background: #dcfce7;
                color: #15803d;
            }

            .method-title {
                font-size: 0.8rem;
                font-weight: 700;
                color: #1f2937;
            }

            .vm-range-bar {
                display: flex;
                flex-direction: column;
                gap: 4px;
                margin-top: 6px;
            }

            .vm-range-row {
                display: flex;
                align-items: center;
                gap: 6px;
                font-size: 0.7rem;
            }

            .vm-range-dot {
                width: 8px;
                height: 8px;
                border-radius: 50%;
                flex-shrink: 0;
            }

            .vm-result-highlight {
                background: linear-gradient(135deg, #ede9fe 0%, #ddd6fe 100%);
                border: 2px solid #7c3aed;
                border-radius: 10px;
                padding: 10px 14px;
                margin-top: 8px;
            }

            .vm-result-value {
                font-size: 1.1rem;
                font-weight: 800;
                color: #5b21b6;
            }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        const Calculator = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <rect x="4" y="2" width="16" height="20" rx="2"/>
                <line x1="8" y1="6" x2="16" y2="6"/>
                <line x1="16" y1="14" x2="16" y2="14.01"/>
                <line x1="12" y1="14" x2="12" y2="14.01"/>
                <line x1="8" y1="14" x2="8" y2="14.01"/>
                <line x1="16" y1="18" x2="16" y2="18.01"/>
                <line x1="12" y1="18" x2="12" y2="18.01"/>
                <line x1="8" y1="18" x2="8" y2="18.01"/>
            </svg>
        );

        const Thermometer = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M14 4v10.54a4 4 0 1 1-4 0V4a2 2 0 0 1 4 0Z"/>
            </svg>
        );

        const TrendingUp = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/>
                <polyline points="16 7 22 7 22 13"/>
            </svg>
        );

        const Settings = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
                <circle cx="12" cy="12" r="3"/>
            </svg>
        );

        const Zap = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
            </svg>
        );

        const FluxWave = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M2 12 C4 6, 6 6, 8 12 C10 18, 12 18, 14 12 C16 6, 18 6, 20 12"/>
                <circle cx="3" cy="12" r="1" fill="currentColor" stroke="none"/>
                <circle cx="21" cy="12" r="1" fill="currentColor" stroke="none"/>
            </svg>
        );

        const ChevronLeft = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <polyline points="15 18 9 12 15 6"/>
            </svg>
        );
  
        const ChevronRight = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <polyline points="9 18 15 12 9 6"/>
            </svg>
        );

        // V/m range guide component
        const VmRangeGuide = ({ vtPerMeter }) => {
            const ranges = [
                { label: 'Small–medium motors', min: 0.7, max: 2.0, colour: '#3b82f6' },
                { label: 'Hydro generators', min: 1.0, max: 3.0, colour: '#10b981' },
                { label: 'Large 2-pole turbo generators', min: 4.0, max: 6.0, colour: '#f59e0b' },
            ];

            const inRange = (min, max) => vtPerMeter >= min && vtPerMeter <= max;
            const anyMatch = ranges.some(r => inRange(r.min, r.max));

            return (
                <div className="bg-blue-50 border border-blue-200 rounded-lg p-3 mt-2">
                    <p className="text-xs font-semibold text-blue-900 mb-2">
                        💡 V<span style={{fontSize:'0.6em',verticalAlign:'sub'}}>t</span>/m Verification Ranges
                    </p>
                    <div className="vm-range-bar">
                        {ranges.map((r, i) => (
                            <div key={i} className="vm-range-row">
                                <div className="vm-range-dot" style={{background: r.colour}}></div>
                                <span style={{color: '#374151', flex: 1}}>{r.label}</span>
                                <span style={{fontWeight: 700, color: r.colour, whiteSpace: 'nowrap'}}>
                                    {r.min}–{r.max} V/m
                                </span>
                                {vtPerMeter !== null && inRange(r.min, r.max) && (
                                    <span style={{color: r.colour, fontWeight: 800}}>✓</span>
                                )}
                            </div>
                        ))}
                    </div>
                    {vtPerMeter !== null && (
                        <div className="vm-result-highlight">
                            <div style={{display:'flex', justifyContent:'space-between', alignItems:'center'}}>
                                <span style={{fontSize:'0.72rem', color:'#5b21b6', fontWeight:600}}>Calculated V<span style={{fontSize:'0.6em',verticalAlign:'sub'}}>t</span> / length:</span>
                                <span className="vm-result-value">{vtPerMeter.toFixed(3)} V/m</span>
                            </div>
                            {!anyMatch && (
                                <p style={{fontSize:'0.68rem', color:'#92400e', marginTop:'4px'}}>
                                    ⚠️ Value outside typical ranges — check inputs or machine type
                                </p>
                            )}
                        </div>
                    )}
                </div>
            );
        };

        function TempCalculator() {
            const [currentPage, setCurrentPage] = useState(0);
            const TOTAL_PAGES = 5;
            const [touchStart, setTouchStart] = useState(null);
            const [touchEnd, setTouchEnd] = useState(null);

            // Page 1 states
            const [R1, setR1] = useState('');
            const [R2, setR2] = useState('');
            const [T1, setT1] = useState('');
            const [T2, setT2] = useState('');
            const [material, setMaterial] = useState('copper');
            const [calculatedField, setCalculatedField] = useState(null);

            // Page 2 states
            const [res1, setRes1] = useState('');
            const [res2, setRes2] = useState('');
            const [res3, setRes3] = useState('');
            const [average, setAverage] = useState(null);
            const [upperLimit, setUpperLimit] = useState(null);
            const [lowerLimit, setLowerLimit] = useState(null);

            // Page 3 states
            const [speed, setSpeed] = useState('');
            const [frequency, setFrequency] = useState('');
            const [poles, setPoles] = useState('');
            const [calculatedField3, setCalculatedField3] = useState(null);
            const [speedWarning, setSpeedWarning] = useState(null);
            const [frequencyWarning, setFrequencyWarning] = useState(null);

            // Page 4 states
            const [realPower, setRealPower] = useState('');
            const [apparentPower, setApparentPower] = useState('');
            const [powerFactor, setPowerFactor] = useState('');
            const [voltage, setVoltage] = useState('');
            const [current, setCurrent] = useState('');
            const [calculatedField4, setCalculatedField4] = useState([]);
            const [reactivePower, setReactivePower] = useState(null);

            // Page 5 — Method 1: Winding Details
            const [wSlots, setWSlots] = useState('');
            const [wWindings, setWWindings] = useState('');
            const [wParallel, setWParallel] = useState('');
            const [wTurns, setWTurns] = useState('');
            const [wPhases, setWPhases] = useState('3');
            const [wVoltage, setWVoltage] = useState('');
            const [wKFactor, setWKFactor] = useState('0.92');
            const [wTestLevel, setWTestLevel] = useState('4');
            const [wCoreLength, setWCoreLength] = useState('');
            const [wResult, setWResult] = useState(null);

            // Page 5 — Method 2: Geometric Data
            const [gCoreLength, setGCoreLength] = useState('');
            const [gBackOD, setGBackOD] = useState('');
            const [gBoreDia, setGBoreDia] = useState('');
            const [gSlotDepth, setGSlotDepth] = useState('');
            const [gFrequency, setGFrequency] = useState('50');
            const [gFluxDensity, setGFluxDensity] = useState('1.2');
            const [gTestLevel, setGTestLevel] = useState('4');
            const [gResult, setGResult] = useState(null);

            const materials = {
                copper: { name: 'Copper', k: 235 },
                aluminum: { name: 'Aluminum', k: 225 }
            };

            const minSwipeDistance = 50;

            const onTouchStart = (e) => {
                setTouchEnd(null);
                setTouchStart(e.targetTouches[0].clientX);
            };

            const onTouchMove = (e) => {
                setTouchEnd(e.targetTouches[0].clientX);
            };

            const onTouchEnd = () => {
                if (!touchStart || !touchEnd) return;
                const distance = touchStart - touchEnd;
                const isLeftSwipe = distance > minSwipeDistance;
                const isRightSwipe = distance < -minSwipeDistance;
                if (isLeftSwipe && currentPage < TOTAL_PAGES - 1) {
                    setCurrentPage(currentPage + 1);
                }
                if (isRightSwipe && currentPage > 0) {
                    setCurrentPage(currentPage - 1);
                }
            };

            const goToPreviousPage = () => {
                if (currentPage > 0) setCurrentPage(currentPage - 1);
            };
            
            const goToNextPage = () => {
                if (currentPage < TOTAL_PAGES - 1) setCurrentPage(currentPage + 1);
            };

            // ── Page 1 ───────────────────────────────────────────────────
            const calculateMissing = () => {
                const r1 = R1 === '' ? null : parseFloat(R1);
                const r2 = R2 === '' ? null : parseFloat(R2);
                const t1 = T1 === '' ? null : parseFloat(T1);
                const t2 = T2 === '' ? null : parseFloat(T2);
                const k = materials[material].k;

                const filled = [r1, r2, t1, t2].filter(v => v !== null);
                const empty = [r1, r2, t1, t2].filter(v => v === null);

                if (filled.length !== 3 || empty.length !== 1) {
                    alert('Please enter exactly 3 values and leave 1 empty to calculate');
                    return;
                }
                if (filled.some(v => isNaN(v))) {
                    alert('Please enter valid numbers');
                    return;
                }
                try {
                    if (r1 === null) {
                        if (r2 <= 0) throw new Error('R2 must be positive');
                        const result = r2 * (k + t1) / (k + t2);
                        if (result <= 0 || !isFinite(result)) throw new Error('Invalid calculation result');
                        setR1(result.toFixed(6));
                        setCalculatedField('R1');
                    } else if (r2 === null) {
                        if (r1 <= 0) throw new Error('R1 must be positive');
                        const result = r1 * (k + t2) / (k + t1);
                        if (result <= 0 || !isFinite(result)) throw new Error('Invalid calculation result');
                        setR2(result.toFixed(6));
                        setCalculatedField('R2');
                    } else if (t1 === null) {
                        if (r1 <= 0 || r2 <= 0) throw new Error('Resistances must be positive');
                        const result = (r1 * (k + t2) / r2) - k;
                        if (!isFinite(result)) throw new Error('Invalid calculation result');
                        setT1(result.toFixed(1));
                        setCalculatedField('T1');
                    } else if (t2 === null) {
                        if (r1 <= 0 || r2 <= 0) throw new Error('Resistances must be positive');
                        const result = (r2 / r1) * (k + t1) - k;
                        if (!isFinite(result)) throw new Error('Invalid calculation result');
                        setT2(result.toFixed(1));
                        setCalculatedField('T2');
                    }
                } catch (error) {
                    alert(error.message || 'Calculation error - please check your values');
                }
            };

            const calculateAverage = () => {
                const r1 = parseFloat(res1);
                const r2 = parseFloat(res2);
                const r3 = parseFloat(res3);
                if (isNaN(r1) || isNaN(r2) || isNaN(r3)) {
                    alert('Please enter valid numbers for all three resistances');
                    return;
                }
                const avg = (r1 + r2 + r3) / 3;
                setAverage(avg);
                setUpperLimit(avg * 1.01);
                setLowerLimit(avg * 0.99);
            };

            const reset = () => {
                setR1(''); setR2(''); setT1(''); setT2('');
                setCalculatedField(null);
            };

            const resetPage2 = () => {
                setRes1(''); setRes2(''); setRes3('');
                setAverage(null); setUpperLimit(null); setLowerLimit(null);
            };

            // ── Page 3 ───────────────────────────────────────────────────
            const calculateSpeed = () => {
                const n = speed === '' ? null : parseFloat(speed);
                const f = frequency === '' ? null : parseFloat(frequency);
                const p = poles === '' ? null : parseFloat(poles);

                setSpeedWarning(null);
                setFrequencyWarning(null);

                const filled = [n, f, p].filter(v => v !== null);
                const empty = [n, f, p].filter(v => v === null);

                if (filled.length !== 2 || empty.length !== 1) {
                    alert('Please enter exactly 2 values and leave 1 empty to calculate');
                    return;
                }
                if (filled.some(v => isNaN(v) || v <= 0)) {
                    alert('Please enter valid positive numbers');
                    return;
                }
                try {
                    if (n === null) {
                        if (!Number.isInteger(p) || p % 2 !== 0) { alert('Poles must be an integer and a factor of 2'); return; }
                        setSpeed(Math.round((120 * f) / p * 100) / 100);
                        setCalculatedField3('speed');
                    } else if (f === null) {
                        if (!Number.isInteger(p) || p % 2 !== 0) { alert('Poles must be an integer and a factor of 2'); return; }
                        setFrequency(Math.round((n * p) / 120 * 100) / 100);
                        setCalculatedField3('frequency');
                    } else if (p === null) {
                        const result = (120 * f) / n;
                        let roundedPoles = Math.round(result);
                        if (roundedPoles % 2 !== 0) {
                            const lowerEven = roundedPoles - 1;
                            const upperEven = roundedPoles + 1;
                            roundedPoles = (Math.abs(result - lowerEven) < Math.abs(result - upperEven)) ? lowerEven : upperEven;
                        }
                        setPoles(roundedPoles);
                        setCalculatedField3('poles');
                        const calcFreq = (n * roundedPoles) / 120;
                        if (Math.abs(calcFreq - f) > 0.5)
                            setFrequencyWarning(`Warning: With ${roundedPoles} poles and ${n} RPM, the frequency would be ${calcFreq.toFixed(2)} Hz (differs by ${Math.abs(calcFreq - f).toFixed(2)} Hz from input ${f} Hz). This may not represent a realistic machine design.`);
                        const calcSpeed = (120 * f) / roundedPoles;
                        if (Math.abs(calcSpeed - n) > 50)
                            setSpeedWarning(`Warning: With ${roundedPoles} poles and ${f} Hz, the speed would be ${calcSpeed.toFixed(2)} RPM (differs by ${Math.abs(calcSpeed - n).toFixed(2)} RPM from input ${n} RPM). This may not represent a realistic machine design.`);
                    }
                } catch (error) {
                    alert('Calculation error - please check your values');
                }
            };

            const resetPage3 = () => {
                setSpeed(''); setFrequency(''); setPoles('');
                setCalculatedField3(null); setSpeedWarning(null); setFrequencyWarning(null);
            };

            // ── Page 4 ───────────────────────────────────────────────────
            const calculatePower = () => {
                const P = realPower === '' ? null : parseFloat(realPower);
                const S = apparentPower === '' ? null : parseFloat(apparentPower);
                const pf = powerFactor === '' ? null : parseFloat(powerFactor);
                const V = voltage === '' ? null : parseFloat(voltage);
                const I = current === '' ? null : parseFloat(current);

                setCalculatedField4([]);

                if (P !== null && (isNaN(P) || P <= 0)) { alert('Real Power must be a positive number'); return; }
                if (S !== null && (isNaN(S) || S <= 0)) { alert('Apparent Power must be a positive number'); return; }
                if (pf !== null && (isNaN(pf) || pf <= 0 || pf > 1)) { alert('Power Factor must be between 0 and 1'); return; }
                if (V !== null && (isNaN(V) || V <= 0)) { alert('Voltage must be a positive number'); return; }
                if (I !== null && (isNaN(I) || I <= 0)) { alert('Current must be a positive number'); return; }

                try {
                    if (V !== null && I !== null) {
                        const calcS = Math.sqrt(3) * V * I / 1000;
                        setApparentPower(calcS.toFixed(1));
                        const calculated = ['apparentPower'];
                        if (pf !== null) {
                            setRealPower((calcS * pf).toFixed(1));
                            calculated.push('realPower');
                            setReactivePower((calcS * Math.sqrt(1 - pf * pf)).toFixed(1));
                        } else if (P !== null) {
                            const calcPF = P / calcS;
                            if (calcPF > 1) { alert('Calculated power factor exceeds 1.0. Please check your values.'); return; }
                            setPowerFactor(calcPF.toFixed(2));
                            calculated.push('powerFactor');
                            setReactivePower((calcS * Math.sqrt(1 - calcPF * calcPF)).toFixed(1));
                        }
                        setCalculatedField4(calculated);
                        return;
                    }

                    if (V !== null && I === null) {
                        if (S !== null) {
                            const calcI = (S * 1000) / (Math.sqrt(3) * V);
                            setCurrent(calcI.toFixed(1));
                            const calculated = ['current'];
                            if (pf !== null) {
                                setRealPower((S * pf).toFixed(1));
                                calculated.push('realPower');
                                setReactivePower((S * Math.sqrt(1 - pf * pf)).toFixed(1));
                            } else if (P !== null) {
                                const calcPF = P / S;
                                if (calcPF > 1) { alert('Calculated power factor exceeds 1.0. Please check your values.'); return; }
                                setPowerFactor(calcPF.toFixed(2));
                                calculated.push('powerFactor');
                                setReactivePower((S * Math.sqrt(1 - calcPF * calcPF)).toFixed(1));
                            }
                            setCalculatedField4(calculated);
                            return;
                        } else if (P !== null && pf !== null) {
                            const calcS = P / pf;
                            setApparentPower(calcS.toFixed(1));
                            setCurrent(((calcS * 1000) / (Math.sqrt(3) * V)).toFixed(1));
                            setReactivePower((calcS * Math.sqrt(1 - pf * pf)).toFixed(1));
                            setCalculatedField4(['apparentPower', 'current']);
                            return;
                        }
                    }

                    if (I !== null && V === null) {
                        if (S !== null) {
                            const calcV = (S * 1000) / (Math.sqrt(3) * I);
                            setVoltage(calcV.toFixed(1));
                            const calculated = ['voltage'];
                            if (pf !== null) {
                                setRealPower((S * pf).toFixed(1));
                                calculated.push('realPower');
                                setReactivePower((S * Math.sqrt(1 - pf * pf)).toFixed(1));
                            } else if (P !== null) {
                                const calcPF = P / S;
                                if (calcPF > 1) { alert('Calculated power factor exceeds 1.0. Please check your values.'); return; }
                                setPowerFactor(calcPF.toFixed(2));
                                calculated.push('powerFactor');
                                setReactivePower((S * Math.sqrt(1 - calcPF * calcPF)).toFixed(1));
                            }
                            setCalculatedField4(calculated);
                            return;
                        } else if (P !== null && pf !== null) {
                            const calcS = P / pf;
                            setApparentPower(calcS.toFixed(1));
                            setVoltage(((calcS * 1000) / (Math.sqrt(3) * I)).toFixed(1));
                            setReactivePower((calcS * Math.sqrt(1 - pf * pf)).toFixed(1));
                            setCalculatedField4(['apparentPower', 'voltage']);
                            return;
                        }
                    }

                    const filled = [P, S, pf].filter(v => v !== null);
                    const empty = [P, S, pf].filter(v => v === null);
                    if (filled.length !== 2 || empty.length !== 1) {
                        alert('Please enter exactly 2 of the 3 main values (P, S, cos θ), or provide V and/or I');
                        return;
                    }
                    if (P === null) {
                        const calcP = S * pf;
                        setRealPower(calcP.toFixed(1));
                        setReactivePower((S * Math.sqrt(1 - pf * pf)).toFixed(1));
                        setCalculatedField4(['realPower']);
                    } else if (S === null) {
                        const calcS = P / pf;
                        setApparentPower(calcS.toFixed(1));
                        setReactivePower((calcS * Math.sqrt(1 - pf * pf)).toFixed(1));
                        setCalculatedField4(['apparentPower']);
                    } else if (pf === null) {
                        if (P > S) { alert('Real power cannot exceed apparent power'); return; }
                        const calcPF = P / S;
                        setPowerFactor(calcPF.toFixed(2));
                        setReactivePower((S * Math.sqrt(1 - calcPF * calcPF)).toFixed(1));
                        setCalculatedField4(['powerFactor']);
                    }
                } catch (error) {
                    alert(error.message || 'Calculation error - please check your values');
                }
            };

            const resetPage4 = () => {
                setRealPower(''); setApparentPower(''); setPowerFactor('');
                setVoltage(''); setCurrent('');
                setCalculatedField4([]); setReactivePower(null);
            };

            // ── Page 5 — Method 1: Winding Details ──────────────────────
            const calculateWindingMethod = () => {
                const S  = parseFloat(wSlots);
                const W  = parseFloat(wWindings);
                const C  = parseFloat(wParallel);
                const T  = parseFloat(wTurns);
                const Pn = parseFloat(wPhases);
                const V  = parseFloat(wVoltage);   // line-to-line volts
                const X  = parseFloat(wTestLevel); // % test level
                const K  = parseFloat(wKFactor);

                if ([S, W, C, T, Pn, V, X].some(v => isNaN(v) || v <= 0)) {
                    alert('Please enter valid positive values for all required fields');
                    return;
                }
                if (isNaN(K) || K <= 0 || K > 1) {
                    alert('Winding factor K must be between 0 and 1');
                    return;
                }
                if (X < 0.1 || X > 100) {
                    alert('Test level X must be between 0.1% and 100%');
                    return;
                }

                // Series turns per phase
                const Tp = (S * W * T) / (Pn * C * 2);

                // Turns in series per phase must be a whole number
                if (Math.abs(Tp - Math.round(Tp)) > 1e-6) {
                    alert('Series turns per phase (Tp) must be a whole number. Please check your slot, windings/slot, turns/coil, phase and parallel circuit values.');
                    return;
                }

                // Single turn voltage at X% test flux level
                // Vt = ((X/100) × V_LL) / (2 × √3 × K × Tp)
                const Vt = ((X / 100) * V) / (2 * Math.sqrt(3) * K * Tp);

                // Optional V/m verification
                let vtPerMeter = null;
                const l = parseFloat(wCoreLength);
                if (!isNaN(l) && l > 0) {
                    vtPerMeter = Vt / l;
                }

                setWResult({ Tp, Vt, vtPerMeter });
            };

            const resetWindingMethod = () => {
                setWSlots(''); setWWindings(''); setWParallel('');
                setWTurns(''); setWPhases('3'); setWVoltage('');
                setWKFactor('0.92'); setWTestLevel('4'); setWCoreLength('');
                setWResult(null);
            };

            // ── Page 5 — Method 2: Geometric Data ───────────────────────
            const calculateGeoMethod = () => {
                const l      = parseFloat(gCoreLength);
                const OD     = parseFloat(gBackOD);
                const bore   = parseFloat(gBoreDia);
                const slotD  = parseFloat(gSlotDepth);
                const hz     = parseFloat(gFrequency);
                const B      = parseFloat(gFluxDensity);
                const X      = parseFloat(gTestLevel); // % test level, for V/m check only

                if ([l, OD, bore, slotD, hz].some(v => isNaN(v) || v <= 0)) {
                    alert('Please enter valid positive values for all fields');
                    return;
                }
                if (isNaN(B) || B <= 0) {
                    alert('Peak flux density B must be a positive value');
                    return;
                }
                if (isNaN(X) || X <= 0 || X > 100) {
                    alert('Test level X must be between 0.1% and 100%');
                    return;
                }
                if (OD <= bore) {
                    alert('Back-of-core diameter must be greater than bore diameter');
                    return;
                }

                // Core thickness (single side)
                const d = (OD - bore) / 2 - slotD;
                if (d <= 0) {
                    alert('Core thickness (d) is zero or negative — check your diameter and slot depth values');
                    return;
                }

                // Single turn voltage: Vt = 1.414 × π × f × l × d × B
                const Vt = 1.414 * Math.PI * hz * l * d * B;
                const vtPerMeter = Vt / l;

                // V/m sanity check scaled to the test flux level (e.g. 0.04× for 4%)
                const vtPerMeterAtTestLevel = vtPerMeter * (X / 100);

                setGResult({ d, Vt, vtPerMeter, vtPerMeterAtTestLevel, testLevel: X, B });
            };

                setGCoreLength(''); setGBackOD(''); setGBoreDia('');

                                            <span className="legend-item">R<span className="sub">2</span> = Resistance at Temp T<span className="sub">2</span></span>

                                            <span className="legend-item">k = Reciprocal of temp. coefficient (235 for Copper)</span>

                                    {poles !== '' && (() => { const p = parseFloat(poles); return !Number.isInteger(p) || p % 2 !== 0; })() && (

                            {/* ── Page 4: Power Triangle Calculator ── */}
                            <div className={`absolute w-full transition-all duration-300 ${pageClass(3)}`}>

                                    <div className="flex items-center justify-center mb-4">

                                        </div>
                                    </div>
                                    <div className="bg-blue-50 border border-blue-200 rounded-lg p-2 mb-3">
                                        <p className="text-xs text-blue-800">💡 <strong>Tip:</strong> Fill 2 of 3 main values, or use V &amp; I for 3-phase calculation.</p>
                                    </div>
                                    <div className="flex gap-3 mb-3">
                                        <button onClick={calculatePower} className="flex-1 bg-indigo-600 text-white py-2.5 rounded-lg font-semibold hover:bg-indigo-700 transition-colors shadow-md text-sm">Calculate</button>
                                        <button onClick={resetPage4} className="px-5 bg-gray-200 text-gray-700 py-2.5 rounded-lg font-semibold hover:bg-gray-300 transition-colors text-sm">Reset</button>
                                    </div>
                                    {reactivePower !== null && (
                                        <div className="bg-gradient-to-r from-green-50 to-emerald-50 rounded-xl p-3 border-2 border-green-200 mb-3">
                                            <div className="flex justify-between items-center">
                                                <span className="text-xs text-gray-700 font-medium">Reactive Power Q:</span>
                                                <span className="text-base font-bold text-indigo-600">{reactivePower} kVAR</span>
                                            </div>
                                        </div>
                                    )}
                                    <div className="formula-card-content">
                                        <div className="formula-title">Power Triangle Formulas</div>
                                        <div className="formula-display" style={{marginBottom:'8px'}}><span>P = S × cos(θ)</span></div>
                                        <div className="formula-display" style={{marginBottom:'8px'}}>
                                            <span>S = </span>
                                            <div className="fraction-container">
                                                <div className="fraction-numerator">P</div>
                                                <div className="fraction-denominator">cos(θ)</div>
                                            </div>
                                        </div>
                                        <div className="formula-display" style={{marginBottom:'8px'}}>
                                            <span>cos(θ) = </span>
                                            <div className="fraction-container">
                                                <div className="fraction-numerator">P</div>
                                                <div className="fraction-denominator">S</div>
                                            </div>
                                        </div>
                                        <div className="formula-display" style={{marginBottom:'8px'}}><span>S<span className="sub">3φ</span> = √3 × V × I</span></div>
                                        <div className="formula-display"><span>P<span className="sub">3φ</span> = √3 × V × I × cos(θ)</span></div>
                                        <div className="formula-legend">
                                            <span className="legend-item"><strong>Where:</strong></span>
                                            <span className="legend-item">P = Real Power (kW)</span>
                                            <span className="legend-item">S = Apparent Power (kVA)</span>
                                            <span className="legend-item">cos(θ) = Power Factor</span>
                                            <span className="legend-item">V = Line Voltage (V)</span>
                                            <span className="legend-item">I = Line Current (A)</span>
                                            <span className="legend-item">/ 1000 used for answers in kW &amp; kVA</span>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            {/* ══════════════════════════════════════════
                                Page 5: Flux Test Parameters
                            ══════════════════════════════════════════ */}
                            <div className={`absolute w-full transition-all duration-300 ${pageClass(4)}`}>
                                <div className="bg-white rounded-2xl shadow-xl p-4 max-h-[calc(100vh-60px)] overflow-y-auto">

                                    {/* Page header */}
                                    <div className="flex items-center justify-center mb-1">
                                        <div className="w-8 h-8 text-indigo-600 mr-3"><FluxWave /></div>
                                        <h1 className="text-lg font-bold text-gray-800">Flux Test Parameters</h1>
                                    </div>
                                    <p className="text-xs text-gray-600 text-center mb-4">
                                        Single turn voltage — two independent methods
                                    </p>

                                    <div className="bg-blue-50 border border-blue-200 rounded-lg p-2 mb-3">
                                        <p className="text-xs text-blue-800">💡 <strong>Note:</strong> The calculation assumes a 3 phase star winding.</p>
                                    </div>

                                    {/* ─────────────────────────────────────
                                        METHOD 1 — Winding Details
                                    ───────────────────────────────────── */}
                                    <div className="method-header">
                                        <span className="method-badge method-badge-1">Method 1</span>
                                        <span className="method-title">Winding Details</span>
                                    </div>

                                    <div className="space-y-2 mb-3">
                                        {/* Row: Slots + Windings per slot */}
                                        <div className="grid grid-cols-2 gap-2">
                                            <div>
                                                <label className="block text-xs font-medium text-gray-700 mb-1">
                                                    No. of Slots <span className="text-gray-400 font-normal">(S)</span>
                                                </label>
                                                <input type="number" step="1" min="1" value={wSlots}
                                                    onChange={e => setWSlots(e.target.value)}
                                                    placeholder="e.g. 78"
                                                    className={stdInput} />
                                            </div>
                                            <div>
                                                <label className="block text-xs font-medium text-gray-700 mb-1">
                                                    Windings/slot <span className="text-gray-400 font-normal">(W)</span>
                                                </label>
                                                <input type="number" step="1" min="1" value={wWindings}
                                                    onChange={e => setWWindings(e.target.value)}
                                                    placeholder="e.g. 2"
                                                    className={stdInput} />
                                            </div>
                                        </div>

                                        {/* Row: Parallel circuits + Turns per coil */}
                                        <div className="grid grid-cols-2 gap-2">
                                            <div>
                                                <label className="block text-xs font-medium text-gray-700 mb-1">
                                                    Parallel circuits <span className="text-gray-400 font-normal">(C)</span>
                                                </label>
                                                <input type="number" step="1" min="1" value={wParallel}
                                                    onChange={e => setWParallel(e.target.value)}
                                                    placeholder="e.g. 2"
                                                    className={stdInput} />
                                            </div>
                                            <div>
                                                <label className="block text-xs font-medium text-gray-700 mb-1">
                                                    Turns/coil <span className="text-gray-400 font-normal">(T)</span>
                                                </label>
                                                <input type="number" step="1" min="1" value={wTurns}
                                                    onChange={e => setWTurns(e.target.value)}
                                                    placeholder="e.g. 5"
                                                    className={stdInput} />
                                            </div>
                                        </div>

                                        {/* Row: Phases + Line voltage */}
                                        <div className="grid grid-cols-2 gap-2">
                                            <div>
                                                <label className="block text-xs font-medium text-gray-700 mb-1">
                                                    Phases <span className="text-gray-400 font-normal">(Pn)</span>
                                                </label>
                                                <input type="number" step="1" min="1" value={wPhases}
                                                    onChange={e => setWPhases(e.target.value)}
                                                    placeholder="e.g. 3"
                                                    className={stdInput} />
                                            </div>
                                            <div>
                                                <label className="block text-xs font-medium text-gray-700 mb-1">
                                                    Line Voltage <span className="text-gray-400 font-normal">(V)</span>
                                                </label>
                                                <input type="number" step="any" min="1" value={wVoltage}
                                                    onChange={e => setWVoltage(e.target.value)}
                                                    placeholder="e.g. 13800"
                                                    className={stdInput} />
                                            </div>
                                        </div>

                                        {/* Row: Stacking factor + Test level */}
                                        <div className="grid grid-cols-2 gap-2">
                                            <div>
                                                <label className="block text-xs font-medium text-gray-700 mb-1">
                                                    Winding factor <span className="text-gray-400 font-normal">(K)</span>
                                                </label>
                                                <input type="number" step="any" min="0" max="1" value={wKFactor}
                                                    onChange={e => setWKFactor(e.target.value)}
                                                    placeholder="0.92"
                                                    className={stdInput} />
                                            </div>
                                            <div>
                                                <label className="block text-xs font-medium text-gray-700 mb-1">
                                                    Test level <span className="text-gray-400 font-normal">(X %)</span>
                                                </label>
                                                <input type="number" step="any" min="0.1" max="100" value={wTestLevel}
                                                    onChange={e => setWTestLevel(e.target.value)}
                                                    placeholder="4"
                                                    className={stdInput} />
                                            </div>
                                        </div>

                                        {/* Optional: core length for V/m check */}
                                        <div>
                                            <label className="block text-xs font-medium text-gray-700 mb-1">
                                                Core length <span className="text-gray-400 font-normal">(m) — optional, for V/m check</span>
                                            </label>
                                            <input type="number" step="any" min="0" value={wCoreLength}
                                                onChange={e => setWCoreLength(e.target.value)}
                                                placeholder="e.g. 1.194"
                                                className={optInput} />
                                        </div>
                                    </div>

                                    {/* Method 1 buttons */}
                                    <div className="flex gap-3 mb-3">
                                        <button onClick={calculateWindingMethod}
                                            className="flex-1 bg-violet-600 text-white py-2.5 rounded-lg font-semibold hover:bg-violet-700 transition-colors shadow-md text-sm">
                                            Calculate
                                        </button>
                                        <button onClick={resetWindingMethod}
                                            className="px-5 bg-gray-200 text-gray-700 py-2.5 rounded-lg font-semibold hover:bg-gray-300 transition-colors text-sm">
                                            Reset
                                        </button>
                                    </div>

                                    {/* Method 1 results */}
                                    {wResult && (
                                        <div className="bg-gradient-to-r from-violet-50 to-purple-50 rounded-xl p-3 border-2 border-violet-200 mb-3">
                                            <h3 className="text-sm font-bold text-gray-800 mb-2">Method 1 Results</h3>
                                            <div className="space-y-1.5">
                                                <div className="flex justify-between items-center pb-1.5 border-b border-violet-200">
                                                    <span className="text-xs text-gray-600">Series turns / phase (T<span style={{fontSize:'0.7em',verticalAlign:'sub'}}>p</span>)</span>
                                                    <span className="text-sm font-bold text-violet-700">{wResult.Tp.toFixed(1)}</span>
                                                </div>
                                                <div className="flex justify-between items-center">
                                                    <span className="text-xs text-gray-600">V<span style={{fontSize:'0.7em',verticalAlign:'sub'}}>t</span> at {wTestLevel}% flux</span>
                                                    <span className="text-lg font-bold text-indigo-700">{wResult.Vt.toFixed(3)} V</span>
                                                </div>
                                            </div>
                                            {wResult.vtPerMeter !== null ? (
                                                <VmRangeGuide vtPerMeter={wResult.vtPerMeter} />
                                            ) : (
                                                <div className="mt-2 text-xs text-gray-500 italic">
                                                    Enter core length above to verify V<span style={{fontSize:'0.7em',verticalAlign:'sub'}}>t</span>/m range
                                                </div>
                                            )}
                                        </div>
                                    )}

                                    {/* Method 1 formula */}
                                    <div className="formula-card-content mb-2">
                                        <div className="formula-title">Method 1 Formulae (Winding Details)</div>
                                        <div className="formula-display" style={{marginBottom:'8px'}}>
                                            <span>T<span className="sub">p</span> = </span>
                                            <div className="fraction-container">
                                                <div className="fraction-numerator">S × W × T</div>
                                                <div className="fraction-denominator">P<span className="sub">n</span> × C × 2</div>
                                            </div>
                                        </div>
                                        <div className="formula-display">
                                            <span>V<span className="sub">t</span> = </span>
                                            <div className="fraction-container">
                                                <div className="fraction-numerator">(X/100) × V<span className="sub">L-L</span></div>
                                                <div className="fraction-denominator">2√3 × K × T<span className="sub">p</span></div>
                                            </div>
                                        </div>
                                        <div className="formula-legend">
                                            <span className="legend-item"><strong>Where:</strong></span>
                                            <span className="legend-item">S = Number of stator slots</span>
                                            <span className="legend-item">W = Coil-sides (bars) per slot</span>
                                            <span className="legend-item">T = Series turns per coil</span>
                                            <span className="legend-item">P<span className="sub">n</span> = Number of phases</span>
                                            <span className="legend-item">C = Parallel circuits per phase</span>
                                            <span className="legend-item">V<span className="sub">L-L</span> = Line-to-line voltage (V)</span>
                                            <span className="legend-item">K = Combined k<span className="sub">d</span> and k<span className="sub">p</span>, the distribution and pitch factors — use 0.92 if unknown</span>
                                            <span className="legend-item">X = Test flux level (%) — range 0.1 to 100</span>
                                        </div>
                                    </div>

                                    {/* Divider between methods */}
                                    <div className="section-divider">
                                        <div className="section-divider-line"></div>
                                        <span className="section-divider-label">or use geometric data</span>
                                        <div className="section-divider-line"></div>
                                    </div>

                                    {/* ─────────────────────────────────────
                                        METHOD 2 — Geometric Data
                                    ───────────────────────────────────── */}
                                    <div className="method-header">
                                        <span className="method-badge method-badge-2">Method 2</span>
                                        <span className="method-title">Geometric Data</span>
                                    </div>

                                    <div className="space-y-2 mb-3">
                                        {/* Row: Core length + Frequency */}
                                        <div className="grid grid-cols-2 gap-2">
                                            <div>
                                                <label className="block text-xs font-medium text-gray-700 mb-1">
                                                    Core length <span className="text-gray-400 font-normal">(l) m</span>
                                                </label>
                                                <input type="number" step="any" min="0" value={gCoreLength}
                                                    onChange={e => setGCoreLength(e.target.value)}
                                                    placeholder="e.g. 1.194"
                                                    className={stdInput} />
                                            </div>
                                            <div>
                                                <label className="block text-xs font-medium text-gray-700 mb-1">
                                                    Frequency <span className="text-gray-400 font-normal">(Hz)</span>
                                                </label>
                                                <input type="number" step="any" min="1" value={gFrequency}
                                                    onChange={e => setGFrequency(e.target.value)}
                                                    placeholder="50"
                                                    className={stdInput} />
                                            </div>
                                        </div>

                                        {/* Back of core OD */}
                                        <div>
                                            <label className="block text-xs font-medium text-gray-700 mb-1">
                                                Back-of-core diameter <span className="text-gray-400 font-normal">(OD) m</span>
                                            </label>
                                            <input type="number" step="any" min="0" value={gBackOD}
                                                onChange={e => setGBackOD(e.target.value)}
                                                placeholder="e.g. 1.778"
                                                className={stdInput} />
                                        </div>

                                        {/* Bore diameter */}
                                        <div>
                                            <label className="block text-xs font-medium text-gray-700 mb-1">
                                                Bore diameter <span className="text-gray-400 font-normal">m</span>
                                            </label>
                                            <input type="number" step="any" min="0" value={gBoreDia}
                                                onChange={e => setGBoreDia(e.target.value)}
                                                placeholder="e.g. 1.168"
                                                className={stdInput} />
                                        </div>

                                        {/* Slot depth */}
                                        <div>
                                            <label className="block text-xs font-medium text-gray-700 mb-1">
                                                Slot depth <span className="text-gray-400 font-normal">m</span>
                                            </label>
                                            <input type="number" step="any" min="0" value={gSlotDepth}
                                                onChange={e => setGSlotDepth(e.target.value)}
                                                placeholder="e.g. 0.133"
                                                className={stdInput} />
                                        </div>

                                        {/* Peak flux density + Test level */}
                                        <div className="grid grid-cols-2 gap-2">
                                            <div>
                                                <label className="block text-xs font-medium text-gray-700 mb-1">
                                                    Peak flux density <span className="text-gray-400 font-normal">(B) Tesla</span>
                                                </label>
                                                <input type="number" step="any" min="0" value={gFluxDensity}
                                                    onChange={e => setGFluxDensity(e.target.value)}
                                                    placeholder="e.g. 1.2"
                                                    className={stdInput} />
                                            </div>
                                            <div>
                                                <label className="block text-xs font-medium text-gray-700 mb-1">
                                                    Test level <span className="text-gray-400 font-normal">(X %)</span>
                                                </label>
                                                <input type="number" step="any" min="0.1" max="100" value={gTestLevel}
                                                    onChange={e => setGTestLevel(e.target.value)}
                                                    placeholder="4"
                                                    className={optInput} />
                                                <p className="text-xs text-gray-400 mt-1">
                                                    Typical: 4%
                                                </p>
                                            </div>
                                        </div>
                                        <p className="text-xs text-gray-400 -mt-1">
                                            Typical B: turbo generator ~1.4 T &nbsp;·&nbsp; hydro generator ~1.0 T &nbsp;·&nbsp; motor ~1.2 T
                                        </p>
                                    </div>

                                    {/* Method 2 derived display (shown if enough data) */}
                                    {gBackOD && gBoreDia && gSlotDepth && !isNaN(parseFloat(gBackOD)) && !isNaN(parseFloat(gBoreDia)) && !isNaN(parseFloat(gSlotDepth)) && (() => {
                                        const d = (parseFloat(gBackOD) - parseFloat(gBoreDia)) / 2 - parseFloat(gSlotDepth);
                                        return d > 0 ? (
                                            <div className="bg-gray-50 border border-dashed border-gray-300 rounded-lg p-2 mb-3 flex items-center gap-2">
                                                <span className="text-xs text-gray-500">Core thickness (d):</span>
                                                <span className="text-xs font-bold text-gray-700">{d.toFixed(4)} m</span>
                                                <span className="text-xs text-gray-400 ml-auto">= (OD − bore) / 2 − slot depth</span>
                                            </div>
                                        ) : (
                                            <div className="bg-red-50 border border-red-200 rounded-lg p-2 mb-3">
                                                <p className="text-xs text-red-700">⚠️ Core thickness is negative — check diameter and slot depth values</p>
                                            </div>
                                        );
                                    })()}

                                    {/* Method 2 buttons */}
                                    <div className="flex gap-3 mb-3">
                                        <button onClick={calculateGeoMethod}
                                            className="flex-1 bg-emerald-600 text-white py-2.5 rounded-lg font-semibold hover:bg-emerald-700 transition-colors shadow-md text-sm">
                                            Calculate
                                        </button>
                                        <button onClick={resetGeoMethod}
                                            className="px-5 bg-gray-200 text-gray-700 py-2.5 rounded-lg font-semibold hover:bg-gray-300 transition-colors text-sm">
                                            Reset
                                        </button>
                                    </div>

                                    {/* Method 2 results */}
                                    {gResult && (
                                        <div className="bg-gradient-to-r from-emerald-50 to-green-50 rounded-xl p-3 border-2 border-emerald-200 mb-3">
                                            <h3 className="text-sm font-bold text-gray-800 mb-2">Method 2 Results</h3>
                                            <div className="space-y-1.5">
                                                <div className="flex justify-between items-center pb-1.5 border-b border-emerald-200">
                                                    <span className="text-xs text-gray-600">Core thickness (d)</span>
                                                    <span className="text-sm font-bold text-emerald-700">{gResult.d.toFixed(4)} m</span>
                                                </div>
                                                <div className="flex justify-between items-center pb-1.5 border-b border-emerald-200">
                                                    <span className="text-xs text-gray-600">Peak flux density (B)</span>
                                                    <span className="text-sm font-bold text-emerald-700">{gResult.B.toFixed(2)} T</span>
                                                </div>
                                                <div className="flex justify-between items-center">
                                                    <span className="text-xs text-gray-600">Single turn voltage (V<span style={{fontSize:'0.7em',verticalAlign:'sub'}}>t</span>) at {gResult.B.toFixed(2)} T</span>
                                                    <span className="text-lg font-bold text-indigo-700">{gResult.Vt.toFixed(3)} V</span>
                                                </div>
                                            </div>
                                            <p className="text-xs text-gray-500 mt-2 italic">
                                                V/m check below scaled to {gResult.testLevel}% test level ({(gResult.testLevel / 100).toFixed(2)}×)
                                            </p>
                                            <VmRangeGuide vtPerMeter={gResult.vtPerMeterAtTestLevel} />
                                        </div>
                                    )}

                                    {/* Method 2 formula */}
                                    <div className="formula-card-content">
                                        <div className="formula-title">Method 2 Formulae (Geometric Data)</div>
                                        <div className="formula-display" style={{marginBottom:'8px'}}>
                                            <span>d = </span>
                                            <div className="fraction-container">
                                                <div className="fraction-numerator">OD − bore</div>
                                                <div className="fraction-denominator">2</div>
                                            </div>
                                            <span> − slot depth</span>
                                        </div>
                                        <div className="formula-display">
                                            <span>V<span className="sub">t</span> = 1.414 × π × f × l × d × B</span>
                                        </div>
                                        <div className="formula-legend">
                                            <span className="legend-item"><strong>Where:</strong></span>
                                            <span className="legend-item">d = Depth from base of slots to back of core (m)</span>
                                            <span className="legend-item">OD = Back-of-core (outer) diameter (m)</span>
                                            <span className="legend-item">bore = Stator bore diameter (m)</span>
                                            <span className="legend-item">l = Magnetic equivalent core length, excl. radial vents (m)</span>
                                            <span className="legend-item">f = Supply frequency (Hz)</span>
                                            <span className="legend-item">B = Peak flux density in core back / yoke (Tesla)</span>
                                            <span className="legend-item">1.414 = √2 (peak factor)</span>
                                        </div>
                                    </div>

                                    {/* V/m range guidance tip — always visible */}
                                    <div className="bg-amber-50 border border-amber-200 rounded-lg p-3 mt-2">
                                        <p className="text-xs font-semibold text-amber-900 mb-2">
                                            📐 V<span style={{fontSize:'0.7em',verticalAlign:'sub'}}>t</span>/m Sanity Check — divide result by core length
                                        </p>
                                        <div className="vm-range-bar">
                                            <div className="vm-range-row">
                                                <div className="vm-range-dot" style={{background:'#3b82f6'}}></div>
                                                <span style={{color:'#374151', flex:1}}>Small–medium motors</span>
                                                <span style={{fontWeight:700, color:'#3b82f6', whiteSpace:'nowrap'}}>~ 0.7 – 2 V/m</span>
                                            </div>
                                            <div className="vm-range-row">
                                                <div className="vm-range-dot" style={{background:'#10b981'}}></div>
                                                <span style={{color:'#374151', flex:1}}>Hydro generators</span>
                                                <span style={{fontWeight:700, color:'#10b981', whiteSpace:'nowrap'}}>~ 1 – 3 V/m</span>
                                            </div>
                                            <div className="vm-range-row">
                                                <div className="vm-range-dot" style={{background:'#f59e0b'}}></div>
                                                <span style={{color:'#374151', flex:1}}>Large 2-pole turbo generators</span>
                                                <span style={{fontWeight:700, color:'#f59e0b', whiteSpace:'nowrap'}}>~ 4 – 6 V/m</span>
                                            </div>
                                        </div>
                                    </div>

                                </div>
                            </div>
                            {/* ── End Page 5 ── */}

                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<TempCalculator />, document.getElementById('root'));
    </script>

    <!-- Service Worker Registration -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('service-worker.js')
                    .then(reg => console.log('Service Worker registered'))
                    .catch(err => console.log('Service Worker registration failed'));
            });
        }
    </script>
</body>
</html>
